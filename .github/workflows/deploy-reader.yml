name: Deploy novel reader

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Keep filling chapter audio in small batches after the first deploy.
    - cron: "10,40 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-progress builds: TTS batches are long, and Pages would
# otherwise abort them when a newer push/schedule arrives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install edge-tts

      # GitHub cache keys are immutable: a primary-key hit never saves again.
      # Restore the newest previous cache, then always save under a unique key
      # so each scheduled batch can grow the TTS library.
      - name: Restore TTS audio cache
        uses: actions/cache/restore@v5
        with:
          path: .tts-cache
          key: tts-cache-${{ github.run_id }}
          restore-keys: |
            tts-cache-

      - name: Build reader with audio batch
        env:
          USHEN_TTS: "1"
          # Synthesize both switchable voices; each chapter may produce two mp3s.
          USHEN_TTS_VOICES: xiaoxiao,yunjian
          # Only fill this many incomplete chapters per run.
          # Cached chapter/voice files are always copied into the deploy artifact.
          USHEN_TTS_BATCH: "10"
        run: python3 build_reader.py --with-audio

      - name: Save TTS audio cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .tts-cache
          key: tts-cache-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
