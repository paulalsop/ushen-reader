name: Deploy novel reader

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Keep filling chapter audio in small batches after the first deploy.
    - cron: "10,40 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-progress builds: TTS batches are long, and Pages would
# otherwise abort them when a newer push/schedule arrives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Cache TTS audio
        uses: actions/cache@v5
        with:
          path: .tts-cache
          key: tts-cache-${{ hashFiles('章节/*.txt') }}
          restore-keys: |
            tts-cache-

      - name: Build reader with audio batch
        env:
          USHEN_TTS: "1"
          USHEN_TTS_VOICE: zh-CN-XiaoxiaoNeural
          # Only newly synthesize this many missing/changed chapters per run.
          # Cached chapters are always copied into the deploy artifact.
          USHEN_TTS_BATCH: "15"
        run: python3 build_reader.py --with-audio

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
